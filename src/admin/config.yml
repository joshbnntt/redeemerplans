backend:
  name: git-gateway
  branch: main # Branch to update (optional; defaults to master)
media_folder: "src/assets/images"
collections:
  - name: "plans"
    label: "Reading Plans"
    folder: "src/plan"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Description", name: "description", widget: "string"}
      - {label: "Start Date", name: "start", widget: "date", default: '', format: "MM-DD-YYYY"}
      - {label: "Current Plan", name: "current", widget: "boolean", default: false}
      - name: "plan" 
        label: "Plan"
        widget: "list"
        fields:
          - {name: "day", label: "Passages", widget: "string"}
          - {name: "alt", label: "Alternate", widget: "string", default: "", required: false}